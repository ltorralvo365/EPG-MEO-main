name: EPG MEO - a cada 5 dias

on:
  schedule:
    - cron: '15 6 * * *'  # Verifica diariamente, executa quando passaram 5 dias
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: epg-meo-atualizacao
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Obter repositorio e historico
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Verificar intervalo de 5 dias
        id: intervalo
        shell: bash
        run: |
          python - <<'PY'
          import datetime, os, pathlib
          path = pathlib.Path('.ultima_extracao_utc')
          executar = True
          if os.environ.get('GITHUB_EVENT_NAME') == 'schedule' and path.exists():
              ultima = datetime.datetime.fromisoformat(path.read_text().strip())
              if ultima.tzinfo is None:
                  ultima = ultima.replace(tzinfo=datetime.timezone.utc)
              executar = datetime.datetime.now(datetime.timezone.utc) - ultima >= datetime.timedelta(days=5)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'executar={str(executar).lower()}\n')
          print('Executar extracao:', executar)
          PY

      - name: Extrair e combinar todos os XML
        if: steps.intervalo.outputs.executar == 'true'
        run: python epg_meogo_github.py --extrair

      - name: Registar execucao bem sucedida
        if: steps.intervalo.outputs.executar == 'true'
        run: |
          python - <<'PY'
          import datetime, pathlib
          pathlib.Path('.ultima_extracao_utc').write_text(datetime.datetime.now(datetime.timezone.utc).isoformat() + '\n')
          PY

      - name: Guardar EPG_UPDATE no repositorio
        if: steps.intervalo.outputs.executar == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f output_epg/*.xml EPG_UPDATE/epg_meogo.xml.gz .ultima_extracao_utc
          if ! git diff --cached --quiet; then
            git commit -m 'Atualizar EPG MEO automaticamente'
            git fetch origin main
            git rebase -X theirs origin/main
            git push origin HEAD:main
          fi
